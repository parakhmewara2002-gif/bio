<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Biodata & Resume Studio</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --primary:#7B1113; --primary-dark:#5d0d0f; --gold:#c79a3a; --text:#3a3a3a; --bg:#fffdf8; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Mukta',sans-serif; color:var(--text); background:var(--bg); line-height:1.7; min-height:100vh; display:flex; align-items:center; }
  .wrap{ max-width:560px; margin:0 auto; padding:50px 24px 80px; text-align:center; }
  .back{ display:inline-block; margin-bottom:24px; color:var(--primary-dark); text-decoration:none; font-weight:600; font-size:14px; }
  .back:hover{ text-decoration:underline; }
  h1{ font-family:'Playfair Display',serif; color:var(--primary-dark); font-size:32px; margin-bottom:14px; }
  .card{ background:#fff; border:1px solid #f0e3c8; border-radius:16px; padding:34px 30px; box-shadow:0 12px 32px -16px rgba(0,0,0,.15); margin-top:20px; }
  .email{ display:inline-block; margin-top:10px; font-size:18px; font-weight:700; color:var(--primary-dark); text-decoration:none; padding:10px 22px; border:2px solid var(--gold); border-radius:999px; }
  .email:hover{ background:var(--gold); color:#fff; }
  p{ color:#666; }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="../index.html">&larr; Back to Biodata &amp; Resume Studio</a>

  <h1>Contact Us</h1>

  <div class="card">
    <p>Have a question, found a bug, or want to suggest a new template? We'd love to hear from you.</p>
    <a class="email" href="mailto:latesttecno2019@gmail.com">latesttecno2019@gmail.com</a>
  </div>

</div>
</body>
</html>
